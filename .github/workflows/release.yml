name: Build trusted release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Установить зависимости сборки
        shell: pwsh
        run: |
          npm ci --prefix apps/web
          choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Собрать полностью офлайн-установщик
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = '0.6.1' }
          ./scripts/build-portable-installer.ps1 -Version $version

      - name: Проверить тихую установку и удаление
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'Chaos Link installer test кириллица'
          $setupLog = Join-Path $env:RUNNER_TEMP 'ChaosLink-setup-test.log'
          $setupArguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /MERGETASKS=!desktopicon /DIR=`"$testRoot`" /LOG=`"$setupLog`""
          $setup = Start-Process ./dist/ChaosLink-Setup.exe -Wait -PassThru -ArgumentList $setupArguments
          if ($setup.ExitCode -ne 0) { Get-Content $setupLog; throw "Setup failed: $($setup.ExitCode)" }
          foreach ($path in @(
            'app/server/ChaosLink.Server.exe', 'app/agent/ChaosLink.Agent.exe',
            'app/control/ChaosLink.Control.exe', 'tools/AutoHotkey64.exe',
            'tools/cloudflared.exe', 'runtime/access.json', '.chaos-link-install'
          )) {
            if (-not (Test-Path (Join-Path $testRoot $path))) { throw "Missing installed file: $path" }
          }
          $before = Get-Content (Join-Path $testRoot 'runtime/access.json') -Raw | ConvertFrom-Json
          $upgrade = Start-Process ./dist/ChaosLink-Setup.exe -Wait -PassThru -ArgumentList $setupArguments
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade failed: $($upgrade.ExitCode)" }
          $after = Get-Content (Join-Path $testRoot 'runtime/access.json') -Raw | ConvertFrom-Json
          if ($before.RoomCode -ne $after.RoomCode -or
              $before.ControllerToken -ne $after.ControllerToken -or
              $before.AdminToken -ne $after.AdminToken) {
            throw 'Upgrade replaced existing room credentials.'
          }
          $uninstaller = Get-ChildItem $testRoot -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Inno Setup uninstaller was not installed.' }
          $uninstall = Start-Process $uninstaller.FullName -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          )
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $testRoot); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $testRoot) { throw "Installer test directory remains: $testRoot" }

      - name: Подтвердить происхождение EXE
        uses: actions/attest@v4
        with:
          subject-path: dist/*.exe

      - name: Сохранить файлы сборки
        uses: actions/upload-artifact@v7
        with:
          name: ChaosLink-Windows
          if-no-files-found: error
          path: |
            dist/ChaosLink-Setup.exe
            dist/SHA256SUMS.txt

      - name: Опубликовать файлы в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo '${{ github.repository }}' --title "Chaos Link $tag" --generate-notes
          }
          gh release upload $tag --repo '${{ github.repository }}' --clobber `
            dist/ChaosLink-Setup.exe dist/SHA256SUMS.txt

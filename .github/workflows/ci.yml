name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Настроить .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Восстановить проекты .NET
        run: dotnet restore ChaosLink.sln

      - name: Собрать проекты .NET
        run: dotnet build ChaosLink.sln --configuration Release --no-restore

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Установить зависимости веб-приложения
        working-directory: apps/web
        run: npm ci

      - name: Проверить стиль веб-приложения
        working-directory: apps/web
        run: npm run lint

      - name: Собрать веб-приложение
        working-directory: apps/web
        run: npm run build

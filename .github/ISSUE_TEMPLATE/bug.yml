name: Сообщение об ошибке
description: Сообщить о воспроизводимой проблеме Chaos Link
title: "[Ошибка]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: Спасибо за сообщение. Удалите ключи доступа, публичные ссылки комнат, имена пользователей и личные медиафайлы из логов и снимков экрана.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Тег релиза или хеш коммита
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Версия Windows, браузер и способ установки
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. Запустить...\n2. Подключиться...\n3. Активировать..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение и очищенные логи
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Проверка безопасности
      options:
        - label: Я проводил проверку только на системах, для которых получил разрешение.
          required: true

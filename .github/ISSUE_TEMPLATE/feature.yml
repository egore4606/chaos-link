name: Предложение функции
description: Предложить конкретное улучшение
title: "[Функция]: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какое ограничение или проблему процесса это решит?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Влияние на ввод и безопасность
      description: Опишите новое управление вводом, разрешения, сетевое взаимодействие или раскрытие данных.
    validations:
      required: true

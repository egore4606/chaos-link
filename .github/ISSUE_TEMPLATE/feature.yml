name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Host-input and security impact
      description: Explain any new input control, permissions, networking, or data exposure.
    validations:
      required: true
